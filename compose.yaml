services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: captures
      POSTGRES_USER: capture
      POSTGRES_PASSWORD: capture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capture -d captures"]
      interval: 2s
      timeout: 2s
      retries: 20

  downstream:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["/out/downstream"]
    environment:
      DOWNSTREAM_ADDR: :8081
      STUB_FAIL_FIRST_N: ${STUB_FAIL_FIRST_N:-0}
      STUB_DELAY_MS: ${STUB_DELAY_MS:-0}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://capture:capture@postgres:5432/captures?sslmode=disable
      DOWNSTREAM_URL: http://downstream:8081/v1/deliveries
      HTTP_ADDR: :8080
      STORAGE_DIR: /var/lib/captures/images
      MAX_BODY_BYTES: 11534336
      MAX_IMAGE_BYTES: 10485760
      WORKER_POLL_INTERVAL: 500ms
      WORKER_LEASE: 30s
      DOWNSTREAM_TIMEOUT: 10s
      RETRY_BASE: 1s
      RETRY_CEILING: 60s
      MAX_ATTEMPTS: 6
    ports:
      - "8080:8080"
    volumes:
      - capture-images:/var/lib/captures/images
    depends_on:
      postgres:
        condition: service_healthy
      downstream:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  capture-images:
